[workspace]
members = ["crates/skm-core", "crates/skm-cli", "crates/skm-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
notify = "8"
notify-debouncer-full = "0.6"
fd-lock = "4"
proptest = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_yaml_ng = "0.10"
icu_collator = "2.4"
rayon = "1.11"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
gpui-kit = { version = "=0.8.1", default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
tempfile = "3"
