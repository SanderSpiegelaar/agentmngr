[workspace]
members = ["crates/skm-core", "crates/skm-cli", "crates/skm-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
gpui-kit = { version = "=0.8.1", default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
tempfile = "3"
