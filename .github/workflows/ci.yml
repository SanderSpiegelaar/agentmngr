name: CI

on: [push, pull_request]

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: macos-latest
            packages: --workspace
          - os: ubuntu-latest
            packages: --workspace --exclude skm-app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy ${{ matrix.packages }} --all-targets -- -D warnings
      - run: cargo test ${{ matrix.packages }}
